<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mobile screenshot sets</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1914px;
        height: 945px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 70px;
        background: radial-gradient(circle at 78% 46%, #d8d2c3 0%, #c9c3b2 34%, #b8ad97 72%, #a9997c 100%);
      }
      body.tracetray {
        background: radial-gradient(60% 90% at 12% 8%, rgba(76, 76, 219, 0.55) 0%, transparent 62%),
          radial-gradient(55% 80% at 92% 96%, rgba(240, 138, 36, 0.24) 0%, transparent 62%),
          radial-gradient(50% 70% at 70% 18%, rgba(176, 63, 176, 0.3) 0%, transparent 66%),
          linear-gradient(115deg, #2c2a6e 0%, #151824 72%);
      }
      body.wikiracr {
        background: radial-gradient(60% 90% at 12% 8%, rgba(88, 166, 255, 0.38) 0%, transparent 62%),
          linear-gradient(110deg, #1f3a5f 0%, #0d1117 74%);
      }
      body.tracetray figure,
      body.wikiracr figure {
        background: #2b313b;
        border-color: rgba(255, 255, 255, 0.16);
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
      }
      figure {
        margin: 0;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 48px;
        background: #333b42;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.3);
        flex: none;
      }
      img {
        display: block;
        width: 365.4px;
        height: 812px;
        border-radius: 36px;
      }
      .landscape {
        border-radius: 30px;
      }
      .landscape img {
        width: 1080px;
        height: 486px;
        border-radius: 18px;
      }
    </style>
  </head>
  <body>
    <script>
      const apps = {
        miscellary: {
          folder: "miscellary/mobile/october-2026/",
          groups: [
            ["01-browse", "09-packs", "06-collection"],
            ["08-pack", "05-reveal", "10-pack-complete"],
            ["02-set", "03-binder"],
          ],
        },
        tracetray: {
          folder: "tracetray/mobile-",
          groups: [
            ["01-pages", "02-trends", "03-journeys"],
            ["04-ask", "05-overview", "06-groups"],
          ],
        },
        wikiracr: {
          folder: "wikiracr/mobile-",
          groups: [
            ["01-home", "02-solo", "03-race"],
            ["04-results", "05-daily", "06-multiplayer"],
          ],
        },
      };
      const params = new URLSearchParams(location.search);
      const app = apps[params.get("app") || "miscellary"];
      const set = Number(params.get("set"));
      if (!app) throw new Error("Unknown app.");
      if (!Number.isInteger(set) || set < 1 || set > app.groups.length)
        throw new Error(`Choose a set from 1 to ${app.groups.length}.`);
      document.body.className = params.get("app") || "miscellary";
      for (const name of app.groups[set - 1]) {
        const frame = document.createElement("figure");
        if (name === "03-binder") frame.className = "landscape";
        const image = document.createElement("img");
        image.src = `../assets/images/${app.folder}${name}.png`;
        image.alt = name;
        frame.append(image);
        document.body.append(frame);
      }
      Promise.all([...document.images].map((image) => image.decode())).then(
        () => (document.documentElement.dataset.ready = "true"),
      );
    </script>
  </body>
</html>
