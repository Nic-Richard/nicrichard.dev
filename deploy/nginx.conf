server {
    listen 80;
    listen [::]:80;
    server_name nicrichard.dev www.nicrichard.dev;
    return 301 https://nicrichard.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nicrichard.dev;

    ssl_certificate /etc/letsencrypt/live/nicrichard.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nicrichard.dev/privkey.pem;

    return 301 https://nicrichard.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nicrichard.dev;

    root /var/www/nicrichard.dev/current;
    index index.html;

    # A location with its own add_header drops these, so the asset block repeats them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    ssl_certificate /etc/letsencrypt/live/nicrichard.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nicrichard.dev/privkey.pem;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
}
