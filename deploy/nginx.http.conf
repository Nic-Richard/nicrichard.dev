server {
    listen 80;
    listen [::]:80;
    server_name nicrichard.dev www.nicrichard.dev;

    root /var/www/nicrichard.dev/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
